<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StarFury — controller raw view</title>
    <style>
      :root {
        color-scheme: dark;
        font: 15px/1.4 system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #0b0f16;
        color: #dce3ee;
      }
      main {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 24px;
        padding: 20px 24px;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #7fd8ff;
      }
      section {
        background: #121924;
        border: 1px solid #263244;
        border-radius: 10px;
        padding: 14px 16px;
      }
      #pad-id {
        font-family: ui-monospace, monospace;
        word-break: break-all;
        margin-bottom: 12px;
      }
      .row {
        display: grid;
        grid-template-columns: 70px 1fr 70px;
        align-items: center;
        gap: 10px;
        margin: 6px 0;
        font-family: ui-monospace, monospace;
      }
      .bar {
        position: relative;
        height: 18px;
        background: #0b0f16;
        border: 1px solid #2c394c;
        border-radius: 4px;
      }
      .bar::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        border-left: 1px solid #3a4a60;
      }
      .fill {
        position: absolute;
        top: 2px;
        bottom: 2px;
        background: #39e4ff;
        border-radius: 2px;
      }
      .fill.unit {
        left: 0;
        background: #ffb41f;
      }
      .lamps {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .lamp {
        width: 46px;
        padding: 6px 0;
        text-align: center;
        border-radius: 6px;
        background: #1b2430;
        border: 1px solid #2c394c;
        font-family: ui-monospace, monospace;
      }
      .lamp.on {
        background: #3dff86;
        color: #04220f;
        box-shadow: 0 0 10px #3dff86;
      }
      .muted {
        color: #7b889b;
      }
      button {
        font: inherit;
        padding: 8px 14px;
        margin: 0 8px 8px 0;
        border-radius: 6px;
        border: 1px solid #39e4ff;
        background: #0f2a35;
        color: #dff8ff;
        cursor: pointer;
      }
      pre {
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-all;
        color: #9fb0c6;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #overlay > * {
        pointer-events: auto;
      }
      #caption {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 10px;
        z-index: 50;
        text-align: center;
        color: #ffe7a8;
        font-size: 14px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h2>Raw controller</h2>
        <div id="pad-id" class="muted">No controller. Chrome lists it only after a stick or switch moves.</div>
        <div id="axes"></div>
        <h2 style="margin-top: 16px">Buttons</h2>
        <div id="buttons" class="lamps"></div>
      </section>
      <section>
        <h2>Mapped input</h2>
        <div id="source" class="muted"></div>
        <div id="mapped"></div>
        <div style="margin-top: 14px">
          <button id="wizard">Run setup wizard</button><button id="clear">Clear mapping</button>
        </div>
        <pre id="mapping"></pre>
      </section>
    </main>
    <div id="overlay"></div>
    <div id="caption"></div>
    <script type="module" src="./input.ts"></script>
  </body>
</html>
