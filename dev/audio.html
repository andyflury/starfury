<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StarFury soundboard</title>
    <style>
      body { font: 14px system-ui, sans-serif; background: #10131a; color: #dde; margin: 16px; }
      h2 { margin: 16px 0 6px; font-size: 15px; }
      button { margin: 2px; padding: 6px 10px; background: #243; color: #dde; border: 1px solid #456; border-radius: 4px; cursor: pointer; }
      button:hover { background: #354; }
      .line { display: inline-block; margin: 2px 6px 2px 0; }
      .row { display: flex; align-items: center; gap: 12px; }
      input[type='range'] { width: 320px; }
      #meter { margin-left: 12px; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div class="row"><button id="unlock">Unlock audio</button><span id="meter"></span></div>
    <h2>Effects</h2>
    <div id="effects"></div>
    <h2>Engine</h2>
    <div class="row"><input id="engine" type="range" min="0" max="1" step="0.01" value="0" /><span id="engineValue">0.00</span></div>
    <h2>Voice (say / queue)</h2>
    <div><button id="stopVoice">Stop voice</button></div>
    <div id="lines"></div>
    <script type="module" src="./audio.ts"></script>
  </body>
</html>
